<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>asesorias-transito</title>

<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
overflow-x:hidden;
background:#fff;
}

/* NAVBAR PREMIUM */

.navbar-premium{
background:linear-gradient(270deg,#000,#1a1a1a,#d4af37,#000);
background-size:600% 600%;
animation:brilloNavbar 8s ease infinite;
border-bottom:2px solid #d4af37;
box-shadow:0 0 12px rgba(212,175,55,.5),0 0 25px rgba(212,175,55,.3);
}

@keyframes brilloNavbar{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.navbar-premium h3{
color:#fff;
font-weight:bold;
text-shadow:0 0 5px rgba(255,255,255,.3),0 0 12px rgba(212,175,55,.8);
}

/* BOTÓN SOLICITUDES (MEJORADO) */

.btn-pendientes{
position:fixed;
top:15px;
right:15px;
background:#d4af37;
color:#000;
padding:8px 14px;
border-radius:40px;
z-index:9999;
font-weight:bold;
cursor:pointer;
display:flex;
align-items:center;
gap:6px;
font-size:13px;
box-shadow:0 4px 12px rgba(0,0,0,.3);
border:2px solid #b8901f;
transition:.3s;
}

.btn-pendientes:hover{
transform:scale(1.05);
box-shadow:0 0 15px rgba(212,175,55,.8);
}

.contador{
background:#fff;
color:#b8901f;
width:22px;
height:22px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:12px;
}

/* PANEL */

.panel{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:500px;
height:100vh;
background:#fff;
z-index:99999;
overflow-y:auto;
transition:.4s;
padding:20px;
box-shadow:-5px 0 20px rgba(0,0,0,.3);
}

.panel.active{right:0;}

.cerrar-panel{
font-size:30px;
cursor:pointer;
float:right;
font-weight:bold;
}

/* CHAT */

.chat-btn{
position:fixed;
bottom:20px;
left:20px;
background:#0b1c2c;
color:#fff;
padding:15px 22px;
border-radius:50px;
cursor:pointer;
z-index:99999;
font-weight:bold;
display:flex;
align-items:center;
gap:10px;
box-shadow:0 4px 15px rgba(0,0,0,.3);
animation:pulse 2s infinite;
}

.chatbox{
position:fixed;
bottom:90px;
left:20px;
width:360px;
max-width:95%;
height:600px;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.3);
display:none;
flex-direction:column;
z-index:99999;
}

.header-chat{
background:#0b1c2c;
color:#fff;
padding:18px;
font-size:18px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
}

.messages{
flex:1;
padding:15px;
overflow-y:auto;
background:#fafafa;
}

.message{
padding:12px;
border-radius:15px;
margin-bottom:12px;
max-width:85%;
font-size:14px;
}

.bot{background:#ececec;}
.user{background:#0b1c2c;color:#fff;margin-left:auto;}

.options button{
display:block;
width:100%;
margin-top:8px;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
background:#d4af37;
font-weight:bold;
}

.input-area{display:flex;border-top:1px solid #ddd;}
.input-area input{flex:1;padding:15px;border:none;outline:none;}
.btn-enviar{background:#0b1c2c;color:#fff;border:none;padding:15px;cursor:pointer;font-weight:bold;}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

</style>

</head>

<body>

<!-- BOTÓN ADMIN -->
<div class="btn-pendientes" onclick="verificarAdmin()">
<div class="contador" id="contadorPendientes">0</div>
Solicitudes
</div>

<!-- PANEL -->
<div class="panel" id="panelSolicitudes">
<span class="cerrar-panel" onclick="cerrarPanel()">&times;</span>
<h2>Solicitudes Pendientes</h2>

<table class="table table-bordered">
<thead class="thead-dark">
<tr>
<th>Servicio</th>
<th>Nombre</th>
<th>Celular</th>
<th>Estado</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="tablaSolicitudes"></tbody>
</table>
</div>

<!-- NAVBAR -->
<div class="w3-top">
<div class="w3-bar navbar-premium w3-padding w3-card">
<h3 style="text-align:center;">Vía Legal Asesoría y Gestiones de tránsito</h3>
</div>
</div>

<script>

const ADMIN_PASSWORD="progreso123";

let solicitudes=JSON.parse(localStorage.getItem("solicitudes"))||[];

function verificarAdmin(){
let pass=prompt("Ingrese contraseña administrador");
if(pass===ADMIN_PASSWORD){document.getElementById("panelSolicitudes").classList.add("active");}
else{alert("Acceso denegado");}
}

function cerrarPanel(){
document.getElementById("panelSolicitudes").classList.remove("active");
}

function mostrarSolicitudes(){
let tabla=document.getElementById("tablaSolicitudes");
tabla.innerHTML="";
let pendientes=0;

solicitudes.forEach((s,i)=>{
if(s.estado==="Pendiente")pendientes++;

tabla.innerHTML+=`
<tr>
<td>${s.tipo}</td>
<td>${s.nombre} ${s.apellido}</td>
<td>${s.celular}</td>
<td>${s.estado}</td>
<td>
<button class="btn btn-success btn-sm" onclick="cambiarEstado(${i})">Responder</button>
<button class="btn btn-danger btn-sm" onclick="eliminarSolicitud(${i})">Eliminar</button>
</td>
</tr>`;
});

document.getElementById("contadorPendientes").innerText=pendientes;
}

function cambiarEstado(i){
solicitudes[i].estado="Respondido";
localStorage.setItem("solicitudes",JSON.stringify(solicitudes));
mostrarSolicitudes();
}

function eliminarSolicitud(i){
solicitudes.splice(i,1);
localStorage.setItem("solicitudes",JSON.stringify(solicitudes));
mostrarSolicitudes();
}

mostrarSolicitudes();

</script>

</body>
</html>
