<!-- REEMPLAZA SOLO ESTE BLOQUE CSS -->

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
overflow-x:hidden;
background:#fff;
}

/* NAVBAR PREMIUM */

.navbar-premium{

background:
linear-gradient(
270deg,
#000000,
#1a1a1a,
#d4af37,
#000000
);

background-size:600% 600%;

animation:brilloNavbar 8s ease infinite;

border-bottom:2px solid #d4af37;

box-shadow:
0 0 12px rgba(212,175,55,.5),
0 0 25px rgba(212,175,55,.3);

}

@keyframes brilloNavbar{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.navbar-premium h3{

color:#fff;

font-weight:bold;

text-shadow:
0 0 5px rgba(255,255,255,.3),
0 0 12px rgba(212,175,55,.8);

}

/* BOTÓN SOLICITUDES */

.btn-pendientes{
position:fixed;
top:18px;
right:18px;
background:#d4af37;
color:#000;
padding:8px 14px;
border-radius:40px;
z-index:9999;
font-weight:bold;
cursor:pointer;
display:flex;
align-items:center;
gap:8px;
font-size:13px;
border:2px solid #000;
box-shadow:
0 0 10px rgba(212,175,55,.7),
0 0 20px rgba(212,175,55,.4);
transition:.3s;
}

.btn-pendientes:hover{
transform:scale(1.05);
}

.contador{
background:#000;
color:#d4af37;
width:24px;
height:24px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:12px;
}

/* PANEL */

.panel{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:500px;
height:100vh;
background:#fff;
z-index:99999;
overflow-y:auto;
transition:.4s;
padding:20px;
box-shadow:-5px 0 20px rgba(0,0,0,.3);
}

.panel.active{
right:0;
}

.cerrar-panel{
font-size:30px;
cursor:pointer;
float:right;
font-weight:bold;
}

/* CHAT MOSTAZA PREMIUM */

.chat-btn{
position:fixed;
bottom:20px;
left:20px;

background:
linear-gradient(
135deg,
#f7d25b,
#d4af37,
#b8860b
);

color:#000;

padding:15px 24px;

border-radius:50px;

cursor:pointer;

z-index:99999;

font-weight:bold;

display:flex;

align-items:center;

gap:10px;

border:2px solid #000;

box-shadow:
0 0 12px rgba(212,175,55,.8),
0 0 24px rgba(212,175,55,.5);

animation:pulse 2s infinite;

transition:.3s;
}

.chat-btn:hover{

transform:scale(1.05);

box-shadow:
0 0 18px rgba(212,175,55,1),
0 0 35px rgba(212,175,55,.8);

}

.chatbox{
position:fixed;
bottom:90px;
left:20px;
width:360px;
max-width:95%;
height:600px;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.3);
display:none;
flex-direction:column;
z-index:99999;
}

.header-chat{
background:#0b1c2c;
color:#fff;
padding:18px;
font-size:18px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
}

.messages{
flex:1;
padding:15px;
overflow-y:auto;
background:#fafafa;
}

.message{
padding:12px;
border-radius:15px;
margin-bottom:12px;
max-width:85%;
font-size:14px;
line-height:1.5;
}

.bot{
background:#ececec;
}

.user{
background:#0b1c2c;
color:#fff;
margin-left:auto;
}

.options button{
display:block;
width:100%;
margin-top:8px;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
background:#d4af37;
font-weight:bold;
transition:.3s;
}

.options button:hover{
transform:scale(1.02);
}

.input-area{
display:flex;
border-top:1px solid #ddd;
}

.input-area input{
flex:1;
padding:15px;
border:none;
outline:none;
}

.btn-enviar{
background:#0b1c2c;
color:#fff;
border:none;
padding:15px;
cursor:pointer;
font-weight:bold;
}

.badge-pendiente{
background:red;
color:#fff;
padding:6px 10px;
border-radius:8px;
}

.badge-respondido{
background:green;
color:#fff;
padding:6px 10px;
border-radius:8px;
}

#toast{
position:fixed;
bottom:30px;
right:30px;
background:#16a34a;
color:#fff;
padding:16px 24px;
border-radius:12px;
font-weight:bold;
z-index:999999;
opacity:0;
transition:.4s;
}

#toast.active{
opacity:1;
}

/* TÍTULOS PREMIUM MOSTAZA */

.titulo-servicio{

background:
linear-gradient(
135deg,
#f7d25b,
#d4af37,
#b8860b
);

color:#000;

padding:10px 14px;

font-weight:bold;

border-bottom-right-radius:14px;

box-shadow:
0 0 10px rgba(212,175,55,.8),
0 0 18px rgba(212,175,55,.4);

text-transform:uppercase;

letter-spacing:.5px;

}

/* IMÁGENES PREMIUM */

.imagen-premium{

width:100%;

height:240px;

object-fit:cover;

border-radius:14px;

border:2px solid #d4af37;

box-shadow:
0 8px 20px rgba(0,0,0,.25),
0 0 18px rgba(212,175,55,.4);

transition:.4s;

}

.imagen-premium:hover{

transform:scale(1.03);

box-shadow:
0 12px 28px rgba(0,0,0,.35),
0 0 25px rgba(212,175,55,.8);

}

/* REDES PREMIUM */

.red-social-premium{

background:
linear-gradient(
270deg,
#000000,
#1a1a1a,
#d4af37,
#000000
);

background-size:600% 600%;

animation:brilloRedes 6s ease infinite;

color:#fff !important;

border-radius:16px;

border:2px solid #d4af37;

box-shadow:
0 0 10px rgba(212,175,55,.6),
0 0 20px rgba(212,175,55,.4);

transition:.3s;

}

.red-social-premium:hover{

transform:scale(1.08);

box-shadow:
0 0 15px rgba(212,175,55,.9),
0 0 30px rgba(212,175,55,.7);

}

@keyframes brilloRedes{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

@media(max-width:768px){

.chatbox{
width:95%;
left:2.5%;
height:80vh;
}

.navbar-premium h3{
font-size:15px;
padding-right:110px;
}

.btn-pendientes{
top:20px;
right:10px;
padding:7px 10px;
font-size:11px;
}

.imagen-premium{
height:220px;
}

}

</style>
