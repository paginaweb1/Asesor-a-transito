<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>asesorias-transito</title>

<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,sans-serif;
overflow-x:hidden;
background:#fff;
-webkit-font-smoothing:antialiased;
text-rendering:optimizeLegibility;
}

.checked{
color:orange;
}

.btn-volver{
position:fixed;
top:50%;
left:15px;
transform:translateY(-50%);
background:#000;
color:#fff;
width:45px;
height:45px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:18px;
z-index:1001;
text-decoration:none;
box-shadow:0 0 10px rgba(0,0,0,.4);
transition:.3s;
}

.btn-volver:hover{
background:#00ff9d;
color:#000;
transform:translateY(-50%) scale(1.1);
}

.chat-btn{
position:fixed;
bottom:20px;
left:20px;
background:#0b1c2c;
color:#fff;
padding:15px 22px;
border-radius:50px;
cursor:pointer;
z-index:99999;
font-weight:bold;
display:flex;
align-items:center;
gap:10px;
box-shadow:0 4px 15px rgba(0,0,0,.3);
animation:pulse 2s infinite;
}

.chat-btn:hover{
transform:scale(1.05);
}

.chatbox{
position:fixed;
bottom:90px;
left:20px;
width:360px;
max-width:95%;
height:600px;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.3);
display:none;
flex-direction:column;
z-index:99999;
}

.header-chat{
background:#0b1c2c;
color:#fff;
padding:18px;
font-size:18px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
}

.messages{
flex:1;
padding:15px;
overflow-y:auto;
background:#fafafa;
scroll-behavior:smooth;
}

.message{
padding:12px;
border-radius:15px;
margin-bottom:12px;
max-width:85%;
line-height:1.4;
font-size:14px;
word-wrap:break-word;
}

.bot{
background:#ececec;
}

.user{
background:#0b1c2c;
color:#fff;
margin-left:auto;
}

.options button{
display:block;
width:100%;
margin-top:8px;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
background:#d4af37;
font-weight:bold;
transition:.3s;
}

.options button:hover{
background:#c49b1e;
transform:translateY(-2px);
}

.input-area{
display:flex;
border-top:1px solid #ddd;
background:#fff;
}

.input-area input{
flex:1;
padding:15px;
border:none;
outline:none;
font-size:15px;
}

.input-area button{
border:none;
padding:15px;
cursor:pointer;
font-weight:bold;
}

.btn-enviar{
background:#0b1c2c;
color:#fff;
}

.btn-limpiar{
background:#dc2626;
color:#fff;
width:55px;
font-size:22px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
transition:.3s;
}

.btn-limpiar:hover{
background:#b91c1c;
transform:scale(1.05);
}

#toast{
position:fixed;
bottom:30px;
right:30px;
background:#16a34a;
color:#fff;
padding:16px 24px;
border-radius:12px;
font-weight:bold;
z-index:999999;
opacity:0;
pointer-events:none;
transition:.4s;
box-shadow:0 4px 15px rgba(0,0,0,.3);
}

#toast.active{
opacity:1;
transform:translateY(-10px);
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

@media(max-width:768px){

.chatbox{
width:95%;
left:2.5%;
height:80vh;
bottom:85px;
}

.chat-btn{
left:10px;
bottom:10px;
padding:13px 18px;
font-size:14px;
}

}

</style>

</head>

<body>

<a href="https://paginaweb1.github.io/dise-os_web.com/" class="btn-volver">
<i class="fa fa-arrow-left"></i>
</a>

<div class="chat-btn" onclick="toggleChat()">

<i class="fa fa-comments"></i>

Haz tu solicitud aquí

</div>

<div class="chatbox" id="chatbox">

<div class="header-chat">

Asistente Jurídico

<span onclick="toggleChat()" style="cursor:pointer;">
&times;
</span>

</div>

<div class="messages" id="messages"></div>

<div class="input-area">

<input
type="text"
id="input"
placeholder="Escribe aquí..."
autocomplete="off"
>

<button
class="btn-enviar"
onclick="sendMessage()"
>
Enviar
</button>

<button
class="btn-limpiar"
onclick="limpiarCampo()"
title="Limpiar campo"
>
✕
</button>

</div>

</div>

<div id="toast">
✅ Solicitud enviada
</div>

<script>

const messages =
document.getElementById("messages");

const input =
document.getElementById("input");

const toast =
document.getElementById("toast");

let step = 0;

let userData = {
servicio:"",
precio:"",
nombre:"",
apellido:"",
cedula:"",
telefono:""
};

const servicios = {

"1":{
nombre:"Derecho de petición",
precio:"80000"
},

"2":{
nombre:"Tutela",
precio:"120000"
},

"3":{
nombre:"Asesoría jurídica",
precio:"60000"
},

"4":{
nombre:"Ejecución de sentencia",
precio:"250000"
},

"5":{
nombre:"Incidente desacato",
precio:"180000"
}

};

function toggleChat(){

const chat =
document.getElementById("chatbox");

chat.style.display =
chat.style.display === "flex"
? "none"
: "flex";

}

function mostrarToast(){

toast.innerHTML =
"✅ Solicitud enviada<br>📞 En un momento nuestro abogado se pondrá en contacto.";

toast.classList.add("active");

setTimeout(()=>{

toast.classList.remove("active");

},4000);

}

function addBotMessage(text){

let div =
document.createElement("div");

div.className = "message bot";

div.innerHTML = text;

messages.appendChild(div);

scrollBottom();

}

function addUserMessage(text){

let div =
document.createElement("div");

div.className = "message user";

div.innerHTML = text;

messages.appendChild(div);

scrollBottom();

}

function scrollBottom(){

requestAnimationFrame(()=>{

messages.scrollTop =
messages.scrollHeight;

});

}

function limpiarCampo(){

input.value = "";

input.focus();

}

function startChat(){

messages.innerHTML = "";

addBotMessage(`

Hola 👋<br><br>

¿Qué servicio necesitas?<br><br>

<div class="options">

<button onclick="selectOption('1')">
Derecho de petición
</button>

<button onclick="selectOption('2')">
Tutela
</button>

<button onclick="selectOption('3')">
Asesoría jurídica
</button>

<button onclick="selectOption('4')">
Ejecución sentencia
</button>

<button onclick="selectOption('5')">
Incidente desacato
</button>

</div>

`);

}

function selectOption(option){

userData.servicio =
servicios[option].nombre;

userData.precio =
servicios[option].precio;

addUserMessage(
servicios[option].nombre
);

addBotMessage(`

Valor aproximado:<br><br>

<b>
$${servicios[option].precio} COP
</b>

<br><br>

Escribe tu nombre.

`);

step = 1;

}

function soloLetras(text){

return /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/
.test(text);

}

function soloNumeros(text){

return /^[0-9]+$/
.test(text);

}

function sendMessage(){

const text =
input.value.trim();

if(text === ""){

addBotMessage(
"⚠️ Campo obligatorio."
);

return;

}

/* NOMBRE */

if(step === 1){

if(!soloLetras(text)){

addBotMessage(
"⚠️ Solo letras."
);

return;

}

userData.nombre = text;

addUserMessage(text);

addBotMessage(
"Ahora escribe tu apellido."
);

input.value = "";

step = 2;

return;

}

/* APELLIDO */

if(step === 2){

if(!soloLetras(text)){

addBotMessage(
"⚠️ Solo letras."
);

return;

}

userData.apellido = text;

addUserMessage(text);

addBotMessage(
"Escribe tu número de cédula."
);

input.value = "";

step = 3;

return;

}

/* CÉDULA */

if(step === 3){

if(!soloNumeros(text)){

addBotMessage(
"⚠️ Solo números."
);

return;

}

userData.cedula = text;

addUserMessage(text);

addBotMessage(
"Escribe tu número de contacto."
);

input.value = "";

step = 4;

return;

}

/* TELÉFONO */

if(step === 4){

if(!soloNumeros(text)){

addBotMessage(
"⚠️ Solo números."
);

return;

}

userData.telefono = text;

addUserMessage(text);

mostrarToast();

addBotMessage(`

✅ <b>Solicitud enviada</b><br><br>

📞 En un momento nuestro abogado se pondrá en contacto.

`);

input.value = "";

step = 0;

userData = {
servicio:"",
precio:"",
nombre:"",
apellido:"",
cedula:"",
telefono:""
};

setTimeout(()=>{

messages.innerHTML = "";

startChat();

},3500);

}

}

input.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

sendMessage();

}

}
);

startChat();

</script>

</body>
</html>
