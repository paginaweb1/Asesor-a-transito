<script>

const ADMIN_PASSWORD = "progreso123";

const messages =
document.getElementById("messages");

const input =
document.getElementById("input");

const toast =
document.getElementById("toast");

let step = 0;

let userData = {
servicio:"",
precio:"",
nombre:"",
apellido:"",
cedula:"",
telefono:""
};

const servicios = {

"1":{
nombre:"Derecho de petición",
precio:"80000"
},

"2":{
nombre:"Tutela",
precio:"120000"
},

"3":{
nombre:"Asesoría jurídica",
precio:"60000"
},

"4":{
nombre:"Ejecución sentencia",
precio:"250000"
},

"5":{
nombre:"Incidente desacato",
precio:"180000"
}

};

let solicitudes =
JSON.parse(localStorage.getItem("solicitudes"))
|| [];

function verificarAdmin(){

const pass =
prompt("Ingrese contraseña administrador");

if(pass === ADMIN_PASSWORD){

abrirPanel();

}else{

alert("Acceso denegado");

}

}

function toggleChat(){

const chat =
document.getElementById("chatbox");

chat.style.display =
chat.style.display === "flex"
? "none"
: "flex";

}

function abrirPanel(){

document.getElementById("panelSolicitudes")
.classList.add("active");

}

function cerrarPanel(){

document.getElementById("panelSolicitudes")
.classList.remove("active");

}

function mostrarToast(){

toast.innerHTML =
"✅ Solicitud enviada<br>📞 En un momento se pondrá en contacto nuestro abogado.";

toast.classList.add("active");

setTimeout(()=>{

toast.classList.remove("active");

},4500);

}

function addBotMessage(text){

let div =
document.createElement("div");

div.className = "message bot";

div.innerHTML = text;

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;

}

function addUserMessage(text){

let div =
document.createElement("div");

div.className = "message user";

div.innerHTML = text;

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;

}

function startChat(){

messages.innerHTML = "";

addBotMessage(`

Hola 👋<br><br>

¿Qué servicio necesitas?<br><br>

<div class="options">

<button onclick="selectOption('1')">
Derecho de petición
</button>

<button onclick="selectOption('2')">
Tutela
</button>

<button onclick="selectOption('3')">
Asesoría jurídica
</button>

<button onclick="selectOption('4')">
Ejecución sentencia
</button>

<button onclick="selectOption('5')">
Incidente desacato
</button>

</div>

`);

}

function selectOption(option){

userData.servicio =
servicios[option].nombre;

userData.precio =
servicios[option].precio;

addUserMessage(
servicios[option].nombre
);

addBotMessage(`

Valor aproximado:<br><br>

<b>
$${servicios[option].precio} COP
</b>

<br><br>

Escribe tu nombre.

`);

step = 1;

}

function soloLetras(text){

return /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/
.test(text);

}

function soloNumeros(text){

return /^[0-9]+$/
.test(text);

}

function sendMessage(){

const text =
input.value.trim();

if(text === ""){

addBotMessage(
"⚠️ Campo obligatorio."
);

return;

}

if(step === 1){

if(!soloLetras(text)){

addBotMessage(
"⚠️ Solo letras."
);

return;

}

userData.nombre = text;

addUserMessage(text);

addBotMessage(
"Ahora escribe tu apellido."
);

input.value = "";

step = 2;

return;

}

if(step === 2){

if(!soloLetras(text)){

addBotMessage(
"⚠️ Solo letras."
);

return;

}

userData.apellido = text;

addUserMessage(text);

addBotMessage(
"Escribe tu número de cédula."
);

input.value = "";

step = 3;

return;

}

if(step === 3){

if(!soloNumeros(text)){

addBotMessage(
"⚠️ Solo números."
);

return;

}

userData.cedula = text;

addUserMessage(text);

addBotMessage(
"Escribe tu número de contacto."
);

input.value = "";

step = 4;

return;

}

if(step === 4){

if(!soloNumeros(text)){

addBotMessage(
"⚠️ Solo números."
);

return;

}

userData.telefono = text;

addUserMessage(text);

const nuevaSolicitud = {

tipo:userData.servicio,
nombre:userData.nombre,
apellido:userData.apellido,
cedula:userData.cedula,
celular:userData.telefono,
precio:userData.precio,
estado:"Pendiente"

};

solicitudes.push(nuevaSolicitud);

localStorage.setItem(
"solicitudes",
JSON.stringify(solicitudes)
);

mostrarSolicitudes();

mostrarToast();

addBotMessage(`

✅ <b>Solicitud enviada</b><br><br>

📞 En un momento se pondrá en contacto nuestro abogado.

`);

input.value = "";

step = 0;

userData = {
servicio:"",
precio:"",
nombre:"",
apellido:"",
cedula:"",
telefono:""
};

setTimeout(()=>{

messages.innerHTML = "";

startChat();

},4500);

}

}

function mostrarSolicitudes(){

const tabla =
document.getElementById("tablaSolicitudes");

tabla.innerHTML = "";

let pendientes = 0;

solicitudes.forEach((solicitud,index)=>{

if(solicitud.estado === "Pendiente"){
pendientes++;
}

tabla.innerHTML += `

<tr>

<td>${solicitud.tipo}</td>

<td>
${solicitud.nombre}
${solicitud.apellido}
</td>

<td>${solicitud.celular}</td>

<td>

<span class="${
solicitud.estado === "Pendiente"
? "badge-pendiente"
: "badge-respondido"
}">

${solicitud.estado}

</span>

</td>

<td>

<button
class="btn btn-sm btn-success"
onclick="cambiarEstado(${index})"
>

Responder

</button>

<button
class="btn btn-sm btn-danger mt-1"
onclick="eliminarSolicitud(${index})"
>

Eliminar

</button>

</td>

</tr>

`;

});

document.getElementById(
"contadorPendientes"
).innerText = pendientes;

}

function cambiarEstado(index){

solicitudes[index].estado =
"Respondido";

localStorage.setItem(
"solicitudes",
JSON.stringify(solicitudes)
);

mostrarSolicitudes();

}

function eliminarSolicitud(index){

solicitudes.splice(index,1);

localStorage.setItem(
"solicitudes",
JSON.stringify(solicitudes)
);

mostrarSolicitudes();

}

input.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

sendMessage();

}

}
);

startChat();

mostrarSolicitudes();

</script>
